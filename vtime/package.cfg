#if (reflex_libraries_source)
{
	include: "project.cfg";
}
#else
{
	include:
	[
		"$[get_reflex_path:]/project_configs/common.cfg",
		"../dsp/package.cfg"
	];

	@Library VTime:
	{
		inherit: reflex_common;
		source_project: "project.cfg";
		cmake_identifier: "VTime::VTime";
		public_include_directories: "include";
		dependencies: DSP;

		@windows: { path: "bin/win/$(Configuration)/$(Architecture)/VTime.lib"; };
		@macos: { path: "bin/macos/$(Configuration)/libVTime.a"; };
		@linux: { path: "bin/linux/$(Configuration)/libVTime.a"; };
		@ios: { path: "bin/ios/$(Configuration)-$(PlatformVariant)/libVTime.a"; };
		@android: { path: "bin/android/$(CONFIGURATION_LOWER)/$(Architecture)/libVTime.a"; };
		@web: { path: "bin/web/$(Configuration)/libVTime.a"; };
	};
}
