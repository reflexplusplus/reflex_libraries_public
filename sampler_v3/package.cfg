#if (reflex_libraries_source)
{
	include: "project.cfg";
}
#else
{
	include:
	[
		"$[get_reflex_path:]/project_configs/common.cfg",
		"../vtime/package.cfg",
		"../netx/package.cfg"
	];

	@Library SamplerV3:
	{
		inherit: reflex_common;
		source_project: "project.cfg";
		cmake_identifier: "SamplerV3::SamplerV3";
		public_include_directories: "include";
		dependencies: [Netx, DSP, VTime];

		@windows: { path: "bin/win/$(Configuration)/$(Architecture)/SamplerV3.lib"; };
		@macos: { path: "bin/macos/$(Configuration)/libSamplerV3.a"; };
		@linux: { path: "bin/linux/$(Configuration)/libSamplerV3.a"; };
		@ios: { path: "bin/ios/$(Configuration)-$(PlatformVariant)/libSamplerV3.a"; };
		@android: { path: "bin/android/$(CONFIGURATION_LOWER)/$(Architecture)/libSamplerV3.a"; };
		@web: { path: "bin/web/$(Configuration)/libSamplerV3.a"; };
	};
}
