#if (reflex_libraries_source)
{
	include: "project.cfg";
}
#else
{
	include: "$[get_reflex_path:]/project_configs/common.cfg";

	@Template DSPLibrary:
	{
		inherit: reflex_common;
		source_project: "project.cfg";
		public_include_directories: "include";

		@windows: { path: "bin/win/$(Configuration)/$(Architecture)/$(TargetName).lib"; };
		@macos: { path: "bin/macos/$(Configuration)/lib$(TargetName).a"; };
		@linux: { path: "bin/linux/$(Configuration)/lib$(TargetName).a"; };
		@ios: { path: "bin/ios/$(Configuration)-$(PlatformVariant)/lib$(TargetName).a"; };
		@android: { path: "bin/android/$(CONFIGURATION_LOWER)/$(Architecture)/lib$(TargetName).a"; };
		@web: { path: "bin/web/$(Configuration)/lib$(TargetName).a"; };
	};

	@Library DSPCore:
	{
		inherit: DSPLibrary;
		cmake_identifier: "DSP::Core";
	};

	@Library DSPUI:
	{
		inherit: DSPLibrary;
		cmake_identifier: "DSP::UI";
		dependencies: DSPCore;
	};

	#if (reflex_include_vm)
	{
		@Library DSPVM:
		{
			inherit: DSPLibrary;
			cmake_identifier: "DSP::VM";
			dependencies: DSPCore;
		};
	}

	@Package DSP:
	{
		#if (reflex_include_vm)
		{
			dependencies: [DSPCore, DSPUI, DSPVM];
		}
		#else
		{
			dependencies: [DSPCore, DSPUI];
		}
	};
}
