// Public ULM package: compile the complete UI from source against prebuilt Core.
include: "$[get_reflex_path:]/project_configs/common.cfg";

name: "ULMUI";

@Library UlmCore:
{
	inherit: reflex_common;
	cmake_identifier: "ULM::Core";
	public_include_directories: "include";

	@windows: { path: "bin/win/$(Configuration)/$(Architecture)/UlmCore.lib"; };
	@macos: { path: "bin/macos/$(Configuration)/libUlmCore.a"; };
	@linux: { path: "bin/linux/$(Configuration)/libUlmCore.a"; };
	@ios: { enabled: false; };
	@android: { enabled: false; };
	@web: { enabled: false; };
};

@Target UlmUi:
{
	inherit: reflex_common;
	type: static_library;
	output_name: "$(TargetName)";
	cmake_identifier: "ULM::Ui";
	public_include_directories: "include";
	dependencies: UlmCore;
	@Files sources: { '': "src/ulm_ui.cpp"; };
	@Files headers: { '': ["include/**/*.h", "src/ui/**/*.h"]; };

	@windows:
	{
		architectures: x64;
		output_directory: "bin/win/$(Configuration)/$(Architecture)";
	};
	@macos:
	{
		architectures: [arm64, x64];
		output_directory: "bin/macos/$(Configuration)";
	};
	@linux:
	{
		architectures: x64;
		output_directory: "bin/linux/$(Configuration)";
	};
	@ios: { enabled: false; };
	@android: { enabled: false; };
	@web: { enabled: false; };
};
