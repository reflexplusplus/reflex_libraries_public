#if (reflex_libraries_source)
{
	include: "project.cfg";
}
#else
{
	include: "$[get_reflex_path:]/project_configs/common.cfg";

	@Library UlmCore:
	{
		inherit: reflex_common;
		source_project: "project.cfg";
		cmake_identifier: "ULM::Core";
		public_include_directories: "include";

		@windows: { path: "bin/win/$(Configuration)/$(Architecture)/UlmCore.lib"; };
		@macos: { path: "bin/macos/$(Configuration)/libUlmCore.a"; };
		@linux: { path: "bin/linux/$(Configuration)/libUlmCore.a"; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
	};

	@Library UlmUi:
	{
		inherit: reflex_common;
		source_project: "project.cfg";
		cmake_identifier: "ULM::Ui";
		public_include_directories: "include";
		dependencies: UlmCore;

		@windows: { path: "bin/win/$(Configuration)/$(Architecture)/UlmUi.lib"; };
		@macos: { path: "bin/macos/$(Configuration)/libUlmUi.a"; };
		@linux: { path: "bin/linux/$(Configuration)/libUlmUi.a"; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
	};
}
