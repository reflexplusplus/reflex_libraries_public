#if (reflex_libraries_source)
{
	include: "project.cfg";
}
#else
{
	include:
	[
		"$[get_reflex_path:]/project_configs/common.cfg",
		"../dsp/package.cfg"
	];

	@Template NetxLibrary:
	{
		inherit: reflex_common;
		source_project: "project.cfg";
		public_include_directories: "include";

		@windows: { path: "bin/win/$(Configuration)/$(Architecture)/$(TargetName).lib"; };
		@macos: { path: "bin/macos/$(Configuration)/lib$(TargetName).a"; };
		@linux: { path: "bin/linux/$(Configuration)/lib$(TargetName).a"; };
		@ios: { path: "bin/ios/$(Configuration)-$(PlatformVariant)/lib$(TargetName).a"; };
		@android: { path: "bin/android/$(CONFIGURATION_LOWER)/$(Architecture)/lib$(TargetName).a"; };
		@web: { path: "bin/web/$(Configuration)/lib$(TargetName).a"; };
	};

	@Library NetxCore:
	{
		inherit: NetxLibrary;
		cmake_identifier: "Netx::Core";
	};

	@Library NetxBootstrapCore:
	{
		inherit: NetxLibrary;
		cmake_identifier: "Netx::BootstrapCore";
		dependencies: [NetxCore, DSPCore];
	};

	@Library NetxBootstrapUI:
	{
		inherit: NetxLibrary;
		cmake_identifier: "Netx::BootstrapUI";
		dependencies: [NetxCore, DSPCore, NetxBootstrapCore];
	};

	@Library NetxBootstrapInstance:
	{
		inherit: NetxLibrary;
		cmake_identifier: "Netx::BootstrapInstance";
		dependencies: [NetxCore, DSPCore, NetxBootstrapCore, NetxBootstrapUI];
	};

	#if (reflex_include_vm)
	{
		@Library NetxBootstrapVM:
		{
			inherit: NetxLibrary;
			cmake_identifier: "Netx::BootstrapVM";
			dependencies: [NetxCore, DSPCore, NetxBootstrapCore, NetxBootstrapUI];
		};
	}

	@Package Netx:
	{
		#if (reflex_include_vm)
		{
			dependencies: [NetxCore, NetxBootstrapCore, NetxBootstrapUI, NetxBootstrapInstance, NetxBootstrapVM];
		}
		#else
		{
			dependencies: [NetxCore, NetxBootstrapCore, NetxBootstrapUI, NetxBootstrapInstance];
		}
	};
}
