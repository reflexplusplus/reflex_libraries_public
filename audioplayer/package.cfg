#if (reflex_libraries_source)
{
	include: "project.cfg";
}
#else
{
	include:
	"$[get_reflex_path:]/project_configs/common.cfg",
	"../vtime/package.cfg",
	"../netx/package.cfg";

	@Library AudioPlayer:
	{
		inherit: reflex_common;
		source_project: "project.cfg";
		cmake_identifier: "AudioPlayer::AudioPlayer";
		public_include_directories: "include";
		dependencies: [VTime, Netx];

		@windows: { path: "bin/win/$(Configuration)/$(Architecture)/AudioPlayer.lib"; };
		@macos: { path: "bin/macos/$(Configuration)/libAudioPlayer.a"; };
		@linux: { path: "bin/linux/$(Configuration)/libAudioPlayer.a"; };
		@ios: { path: "bin/ios/$(Configuration)-$(PlatformVariant)/libAudioPlayer.a"; };
		@android: { path: "bin/android/$[lowercase:$(Configuration)]/$(Architecture)/libAudioPlayer.a"; };
		@web: { path: "bin/web/$(Configuration)/libAudioPlayer.a"; };
	};
}
